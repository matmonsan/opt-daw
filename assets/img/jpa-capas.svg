<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" role="img" aria-label="Arquitectura en tres capas: cliente, controlador, servicio, repositorio y base de datos">
<title>Arquitectura en tres capas con Spring Data JPA</title>
<defs>
<marker id="cAzul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b355a"/></marker>
<marker id="cGris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7f"/></marker>
</defs>
<g font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
<rect x="1" y="1" width="998" height="198" rx="12" fill="#f3f6fa" stroke="#c9d4e2"/>

<rect x="20" y="45" width="160" height="90" rx="10" fill="#ffffff" stroke="#5b6b7f" stroke-width="2"/>
<text x="100" y="88" font-size="19" font-weight="600" fill="#1b355a">Cliente</text>
<text x="100" y="111" font-size="14" fill="#5b6b7f">Postman, navegador</text>

<rect x="220" y="45" width="160" height="90" rx="10" fill="#ffffff" stroke="#1b355a" stroke-width="2.5"/>
<rect x="220" y="45" width="160" height="8" rx="4" fill="#1b355a"/>
<text x="300" y="88" font-size="19" font-weight="600" fill="#1b355a">Controlador</text>
<text x="300" y="111" font-size="14" fill="#5b6b7f">@RestController</text>

<rect x="420" y="45" width="160" height="90" rx="10" fill="#ffffff" stroke="#1b355a" stroke-width="2.5"/>
<rect x="420" y="45" width="160" height="8" rx="4" fill="#1b355a"/>
<text x="500" y="88" font-size="19" font-weight="600" fill="#1b355a">Servicio</text>
<text x="500" y="111" font-size="14" fill="#5b6b7f">@Service</text>

<rect x="620" y="45" width="160" height="90" rx="10" fill="#ffffff" stroke="#1b355a" stroke-width="2.5"/>
<rect x="620" y="45" width="160" height="8" rx="4" fill="#1b355a"/>
<text x="700" y="88" font-size="19" font-weight="600" fill="#1b355a">Repositorio</text>
<text x="700" y="111" font-size="14" fill="#5b6b7f">@Repository</text>

<rect x="820" y="45" width="160" height="90" rx="10" fill="#e6f2f2" stroke="#157878" stroke-width="2.5"/>
<text x="900" y="88" font-size="19" font-weight="600" fill="#157878">Base de datos</text>
<text x="900" y="111" font-size="14" fill="#5b6b7f">MariaDB</text>

<path d="M182 78 H214" stroke="#1b355a" stroke-width="2.5" marker-end="url(#cAzul)"/>
<path d="M382 78 H414" stroke="#1b355a" stroke-width="2.5" marker-end="url(#cAzul)"/>
<path d="M582 78 H614" stroke="#1b355a" stroke-width="2.5" marker-end="url(#cAzul)"/>
<path d="M782 78 H814" stroke="#1b355a" stroke-width="2.5" marker-end="url(#cAzul)"/>
<path d="M218 104 H186" stroke="#5b6b7f" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#cGris)"/>
<path d="M418 104 H386" stroke="#5b6b7f" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#cGris)"/>
<path d="M618 104 H586" stroke="#5b6b7f" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#cGris)"/>
<path d="M818 104 H786" stroke="#5b6b7f" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#cGris)"/>

<path d="M300 165 H340" stroke="#1b355a" stroke-width="2.5" marker-end="url(#cAzul)"/>
<text x="348" y="170" font-size="14" fill="#1b355a" text-anchor="start">petición</text>
<path d="M540 165 H500" stroke="#5b6b7f" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#cGris)"/>
<text x="548" y="170" font-size="14" fill="#5b6b7f" text-anchor="start">respuesta</text>
</g>
</svg>
