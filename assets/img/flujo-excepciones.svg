<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" role="img" aria-label="Flujo de una excepción en una API Spring Boot">
<title>Flujo de una excepción en una API Spring Boot</title>
<defs><marker id="fAzul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b355a"/></marker><marker id="fRojo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/></marker><marker id="fVerde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#157878"/></marker></defs>
<rect x="1" y="1" width="998" height="518" rx="12" fill="#f3f6fa" stroke="#c9d4e2"/>
<rect x="30" y="50" width="220" height="90" rx="10" fill="#ffffff" stroke="#1b355a" stroke-width="2.5"/><rect x="30" y="50" width="220" height="8" rx="4" fill="#1b355a"/><text x="140.0" y="97.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1b355a">Cliente</text><text x="140.0" y="120.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5b6b7f">Postman, navegador, Vue...</text>
<rect x="390" y="50" width="220" height="90" rx="10" fill="#ffffff" stroke="#1b355a" stroke-width="2.5"/><rect x="390" y="50" width="220" height="8" rx="4" fill="#1b355a"/><text x="500.0" y="97.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1b355a">Controlador</text><text x="500.0" y="120.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5b6b7f">@RestController</text>
<rect x="750" y="50" width="220" height="90" rx="10" fill="#ffffff" stroke="#1b355a" stroke-width="2.5"/><rect x="750" y="50" width="220" height="8" rx="4" fill="#1b355a"/><text x="860.0" y="97.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1b355a">Servicio</text><text x="860.0" y="120.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5b6b7f">@Service</text>
<path d="M250 80 H382" fill="none" stroke="#1b355a" stroke-width="2.5" marker-end="url(#fAzul)"/>
<text x="316" y="68" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1b355a">1 · Petición HTTP</text>
<path d="M610 80 H742" fill="none" stroke="#1b355a" stroke-width="2.5" marker-end="url(#fAzul)"/>
<text x="676" y="68" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1b355a">2 · Llama al servicio</text>
<path d="M750 115 H618" fill="none" stroke="#b03a2e" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#fRojo)"/>
<text x="684" y="137" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#b03a2e">3 · throw excepción</text>
<rect x="130" y="250" width="320" height="90" rx="10" fill="#ffffff" stroke="#157878" stroke-width="2.5"/><rect x="130" y="250" width="320" height="8" rx="4" fill="#157878"/><text x="290.0" y="297.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#157878">A · El controlador la captura</text><text x="290.0" y="320.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5b6b7f">try/catch → return ResponseEntity</text>
<rect x="550" y="250" width="320" height="90" rx="10" fill="#ffffff" stroke="#157878" stroke-width="2.5"/><rect x="550" y="250" width="320" height="8" rx="4" fill="#157878"/><text x="710.0" y="297.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#157878">B · Nadie la captura</text><text x="710.0" y="320.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5b6b7f">Spring la convierte en respuesta</text>
<path d="M470 140 L320 242" fill="none" stroke="#b03a2e" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#fRojo)"/>
<path d="M530 140 L680 242" fill="none" stroke="#b03a2e" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#fRojo)"/>
<rect x="320" y="400" width="360" height="90" rx="10" fill="#ffffff" stroke="#1b355a" stroke-width="2.5"/><rect x="320" y="400" width="360" height="8" rx="4" fill="#1b355a"/><text x="500.0" y="447.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1b355a">4 · Respuesta HTTP al cliente</text><text x="500.0" y="470.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5b6b7f">código de estado + cabeceras + cuerpo</text>
<path d="M290 340 L430 392" fill="none" stroke="#157878" stroke-width="2.5" marker-end="url(#fVerde)"/>
<path d="M710 340 L570 392" fill="none" stroke="#157878" stroke-width="2.5" marker-end="url(#fVerde)"/>
<text x="250" y="380" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#157878">el código que decida el controlador</text>
<text x="770" y="380" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#157878">el de la ResponseStatusException (o 500)</text>
</svg>
